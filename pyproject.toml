[project]
name = "api-basics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "FAIZAN KHAN", email = "202166657+faizanuddinkhan7@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
api-basics = "api_basics:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "api-basics",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]
